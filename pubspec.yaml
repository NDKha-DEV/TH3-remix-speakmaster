name: speakmaster_flutter
description: Ứng dụng học tiếng Anh AI chấm điểm phát âm âm vị và theo dõi chuỗi Streak kỷ luật với Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase Authentication & Cloud Firestore
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2
  # Speech Recognition & Audio Playback
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  # M4 – Pronunciation API client
  http: ^1.2.2
  uuid: ^4.5.1
  # Google Gemini AI SDK for Dart
  google_generative_ai: ^0.4.6
  # Local Notifications & State Management
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  firebase_messaging: ^15.2.0
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
